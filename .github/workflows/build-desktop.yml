name: Build desktop apps (macOS & Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            files: dist/*.dmg
          - os: windows-latest
            target: --win
            files: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install build tools
        run: npm ci
      - name: Test math engine and desktop handler
        run: npm test
      - name: Bundle offline Python (Pyodide + NumPy, pandas, matplotlib)
        run: node desktop/fetch-pyodide.mjs
      - name: Build installer
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: آکادمی ریاضی و علم داده ${{ github.ref_name }}
          files: out/*
          body: |
            ## نصب

            **ویندوز:** فایل `Math-Data-Science-Academy-Setup-*.exe` را دانلود و اجرا کن. اگر Windows SmartScreen هشدار داد، روی «More info» و سپس «Run anyway» بزن (نصب‌کننده امضای دیجیتال تجاری ندارد).

            **مک (Apple Silicon و Intel):** فایل `.dmg` را باز کن و برنامه را به پوشهٔ Applications بکش. بار اول روی برنامه راست‌کلیک کن و «Open» را بزن؛ اگر macOS اجازه نداد، در Terminal اجرا کن:
            `xattr -cr "/Applications/Math Data Science Academy.app"`

            پیشرفت و یادداشت‌ها در پوشهٔ دادهٔ برنامه روی همان دستگاه ذخیره می‌شوند. دفترچهٔ پایتون (NumPy، pandas، matplotlib) بدون اینترنت کار می‌کند.
